name: OpenMap Windows Full

on:
  push:
    branches: [main]
    paths:
      - 'openmap-sketchup/extension/**'
      - 'openmap-sketchup/server/**'
      - 'openmap-sketchup/tools/**'
      - '.github/workflows/openmap-windows-full.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmap-windows-full
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        working-directory: openmap-sketchup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Build pinned Windows runtime and OCR
        run: python tools/prepare_runtime.py
      - name: Build Full RBZ and source ZIP
        run: python tools/build.py
      - name: Test packaged Python, OCR and Ruby lifecycle on Windows
        run: python tools/windows-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMap-Windows-Full-0.2.1
          path: |
            openmap-sketchup/dist/*0.2.1*.rbz
            openmap-sketchup/dist/*0.2.1*.zip
            openmap-sketchup/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish verified installer and source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = 'openmap-v0.2.1'
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '0\.2\.0.*\.(rbz|zip)$|^SHA256SUMS\.txt$' } | ForEach-Object { $_.FullName })
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq '.sha'
            if ($existing.Trim() -ne $env:GITHUB_SHA) { throw 'Release tag belongs to another commit; bump the version.' }
            gh release upload $tag @files --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'OpenMap SketchUp 0.2.1 — Windows x64 Full' --notes-file docs/RELEASE_0.2.1.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
